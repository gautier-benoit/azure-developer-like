app.title=User Feedback(local)
# Enable related features.

## Azure Active Directory
# Enable or Disable AAD Login
spring.cloud.azure.active-directory.enabled=true
# Specifies your Active Directory ID:
spring.cloud.azure.active-directory.profile.tenant-id=6fe7e4ab-29ef-42c6-953b-0f8aaa49db29

# Specifies your App Registration's Application ID:
spring.cloud.azure.active-directory.credential.client-id=af3d9f1a-e997-4c06-8ae9-fa5cb9ee5b03

# Specifies your App Registration's secret key:
spring.cloud.azure.active-directory.credential.client-secret=secret

## Cosmos DB
# Specify the DNS URI of your Azure Cosmos DB.
azure.cosmos.uri=https://cosmosdb02.documents.azure.com:443/
# Specify the access key for your database.
azure.cosmos.key=secret
# Specify the name of your database.
azure.cosmos.database=UserFeedBack
azure.cosmos.populateQueryMetrics=false

## Storage Account
# Specify the Storage Account account name.
azure.storage.account-name=sta02
# Specify the Storage Account account key.
azure.storage.account-key=fake
# Specify the Storage Account end point.
azure.storage.blob-endpoint=https://sta02.blob.core.windows.net
